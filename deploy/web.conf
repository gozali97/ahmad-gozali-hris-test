server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    location ^~ /api/ { try_files /__missing__ @laravel; }
    location = /up { try_files /__missing__ @laravel; }
    location = /broadcasting/auth { try_files /__missing__ @laravel; }
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTPS on;
        fastcgi_pass api:9000;
    }
    location ^~ /storage/ { alias /app/storage/app/public/; add_header X-Content-Type-Options nosniff; }
    location ~ /\. { return 404; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
